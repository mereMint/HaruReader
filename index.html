<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Harutronic · HaruReader</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="view-home">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" aria-label="Site navigation">
    <nav class="nav-tabs" aria-label="Main navigation">
      <a href="#home" data-nav="home">Home</a>
      <a href="#library" data-nav="library">Library</a>
      <a href="#continue" data-nav="continue" id="continueBtn">Continue</a>
    </nav>
  </header>

  <main id="main">
    <section class="view hero-view" id="homeView" data-view="home">
      <div class="hero-core">
        <h1 class="glitch-title" data-text="Harutronic">Harutronic</h1>
        <a class="solid-button hero-button" href="#library" id="heroLibraryBtn">Library</a>
      </div>
    </section>

    <section class="view library-view" id="libraryView" data-view="library" hidden>
      <div class="toolbar" role="search">
        <label class="search-box">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Search title…" autocomplete="off">
        </label>
        <div class="filter-row" aria-label="Library filters">
          <div class="filter-menu single-filter-menu" data-menu="filters">
            <button class="filter-menu-button" id="filterButton" type="button" aria-expanded="false" aria-controls="filterPanel">
              <span>Filters</span>
              <strong>Everything</strong>
            </button>
            <div class="filter-panel" id="filterPanel" hidden></div>
          </div>
        </div>
      </div>

      <div class="library-grid" id="libraryGrid" aria-live="polite"></div>
      <p class="empty-state" id="emptyState" hidden>No public entries yet.</p>
    </section>

    <section class="view reader-view" id="readerView" data-view="reader" hidden>
      <article class="reader-card" id="readerArticle" tabindex="-1">
        <header class="reader-head">
          <a class="back-link" href="#library">← Library</a>
          <p class="eyebrow" id="readerKind">Reader</p>
          <h1 id="readerTitle">Choose something from the library</h1>
          <p class="reader-meta" id="readerMeta"></p>
          <div class="meter reader-meter" aria-label="Reading progress"><span id="readerProgressBar"></span></div>
        </header>
        <div id="readerContent" class="prose">
          <p class="muted">Open the library and select a text.</p>
        </div>
        <div id="utterancesWrap" class="utterances-wrap"></div>
      </article>
    </section>
  </main>

  <div class="creator-signature" aria-label="Creator signature">
    <span class="creator-label">Created by</span>
    <strong class="signature-glitch" data-text="Nweb">Nweb</strong>
  </div>

  <div class="content-warning" aria-label="Content warning">
    <span data-text="CONTENT WARNING">CONTENT WARNING</span>
    <p id="warningText">Violence, death, psychological distress, mature themes.</p>
    <p id="warningTimer" class="warning-timer" hidden></p>
  </div>

  <noscript>
    <div class="noscript">HaruReader needs JavaScript to load Markdown/TXT files.</div>
  </noscript>

  <script src="assets/app.js" defer></script>
</body>
</html>
