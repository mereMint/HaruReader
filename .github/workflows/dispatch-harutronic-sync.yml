name: Notify Harutronic of canonical story changes

on:
  push:
    branches: [main]
    paths:
      - "src/stories/**"
      - ".github/workflows/dispatch-harutronic-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Harutronic mirror sync
        env:
          GH_TOKEN: ${{ secrets.HARUTRONIC_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::HARUTRONIC_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          gh api \
            --method POST \
            repos/mereMint/Harutronic/dispatches \
            -f event_type=harureader_stories_changed \
            -f client_payload[repository]="$GITHUB_REPOSITORY" \
            -f client_payload[sha]="$GITHUB_SHA"
